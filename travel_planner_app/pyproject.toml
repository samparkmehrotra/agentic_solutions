[project]
name = "travel_planner_app"
version = "0.1.0"
description = "travel-planner-app using crewAI"
authors = [{ name = "Sampark Mehrotra", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[bedrock,tools]>=1.15.17,<2.0.0",
    "bedrock-agentcore",
    "boto3",
    "aws-opentelemetry-distro",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "markdown>=3.10.3",
    "streamlit>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "18b6182e-8e48-4fa7-a381-a4ffa5d736d4"
